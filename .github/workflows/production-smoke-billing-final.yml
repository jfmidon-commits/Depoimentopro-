name: Production smoke billing final

on:
  push:
    branches:
      - smoke/billing-readiness-final

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit and integration tests
        run: npm test
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find api lib test scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          for f in auth.js dashboard.js billing-ui.js form.js pwa.js sw.js; do node --check "$f"; done
      - name: Billing disabled safety check
        shell: bash
        env:
          BASE_URL: https://depoimentopro-app.vercel.app
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsS "$BASE_URL/api/health")"
          node -e 'const h=JSON.parse(process.argv[1]); if(!h.ok) process.exit(1); if(!h.billing || h.billing.mode!=="disabled") { console.error(h); process.exit(2); }' "$HEALTH"
          code=$(curl -sS -o /tmp/billing.json -w '%{http_code}' -X POST "$BASE_URL/api/billing-checkout" -H "Origin: $BASE_URL" -H 'Content-Type: application/json' --data '{"plan":"starter"}')
          test "$code" = "401"
      - name: Production E2E
        env:
          BASE_URL: https://depoimentopro-app.vercel.app
        run: bash scripts/e2e-production.sh
