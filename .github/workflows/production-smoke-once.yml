name: Production smoke once

on:
  push:
    branches:
      - smoke/production-after-vercel-fix

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run production E2E
        env:
          BASE_URL: https://depoimentopro-app.vercel.app
        run: |
          chmod +x scripts/e2e-production.sh
          bash scripts/e2e-production.sh
