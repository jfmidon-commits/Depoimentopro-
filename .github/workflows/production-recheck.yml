name: Production recheck

on:
  push:
    branches:
      - smoke/recheck-production

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Production E2E
        env:
          BASE_URL: https://depoimentopro-app.vercel.app
        run: bash scripts/e2e-production.sh
