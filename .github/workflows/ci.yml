name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and integration tests
        run: npm test
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find api lib test scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          for f in auth.js dashboard.js billing-ui.js form.js pwa.js sw.js; do
            node --check "$f"
          done
