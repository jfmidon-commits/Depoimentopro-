<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | DepoimentoPro</title><link rel="stylesheet" href="/styles.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2563eb"><link rel="icon" href="/icon-192.png"></head><body>
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="/dashboard">DepoimentoPro</a><div class="nav"><span id="header-user" class="small"></span><button id="logout" class="btn btn-ghost">Sair</button></div></div></header>
<main><div class="container"><section class="welcome"><div><h1 id="hello">Seu dashboard</h1><div class="muted">Crie campanhas, copie o link e modere os depoimentos recebidos.</div></div><div><span id="plan" class="badge"></span></div></section>
<section class="stats"><div class="stat"><span class="muted">Usados</span><b id="used">—</b></div><div class="stat"><span class="muted">Restantes</span><b id="remaining">—</b></div><div class="stat"><span class="muted">Campanhas</span><b id="campaign-count">—</b></div><div class="stat"><span class="muted">Pendentes</span><b id="pending-count">—</b></div></section>
<section class="grid"><div class="card"><h2>Nova campanha</h2><form id="campaign-form"><label for="campaign-name">Nome da campanha</label><input id="campaign-name" name="nome" required placeholder="Ex.: Pós-mentoria agosto"><label for="campaign-email">Mensagem para e-mail</label><textarea id="campaign-email" name="mensagemEmail" placeholder="Olá! Você poderia deixar um depoimento sobre sua experiência?"></textarea><label for="campaign-whatsapp">Mensagem para WhatsApp</label><textarea id="campaign-whatsapp" name="mensagemWhatsApp" placeholder="Oi! Posso te pedir um depoimento rápido?"></textarea><div class="form-actions"><button class="btn btn-primary" type="submit">Criar campanha</button></div><div id="campaign-msg" class="message"></div></form></div>
<div class="card"><h2>Suas campanhas</h2><div id="campaigns" class="list"><div class="empty">Carregando…</div></div></div></section>
<section class="card" style="margin-top:20px"><h2>Depoimentos recebidos</h2><div id="testimonials" class="list"><div class="empty">Carregando…</div></div></section></div></main><script src="/dashboard.js"></script><script src="/pwa.js"></script></body></html>
