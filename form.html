<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar depoimento | DepoimentoPro</title><link rel="stylesheet" href="/styles.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2563eb"><link rel="icon" href="/icon-192.png"></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="/">DepoimentoPro</a></div></header><main class="public-wrap"><div class="public-card"><h1 id="campaign-title">Carregando…</h1><p id="campaign-message" class="muted"></p><div id="load-error" class="message" role="alert"></div><form id="testimonial-form" hidden><input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off"><label for="nomeCliente">Seu nome</label><input id="nomeCliente" name="nomeCliente" required minlength="2" maxlength="120"><label for="texto">Seu depoimento</label><textarea id="texto" name="texto" required minlength="10" maxlength="2000" placeholder="Conte de forma sincera como foi sua experiência."></textarea><label for="nota">Sua nota</label><select id="nota" name="nota" required><option value="">Selecione</option><option value="5">★★★★★ — Excelente</option><option value="4">★★★★ — Muito bom</option><option value="3">★★★ — Bom</option><option value="2">★★ — Regular</option><option value="1">★ — Ruim</option></select><label class="consent"><input type="checkbox" id="consentimento" required><span>Autorizo que este depoimento seja revisado e, se aprovado, publicado pelo responsável pela campanha como prova social.</span></label><div id="turnstile-box"></div><div class="form-actions"><button id="testimonial-submit" class="btn btn-primary" type="submit">Enviar depoimento</button></div><div id="form-msg" class="message" role="status" aria-live="polite"></div></form><p class="small" style="margin-top:18px">O envio não publica automaticamente: o depoimento entra como pendente para moderação.</p></div></main><script src="/form.js"></script><script src="/pwa.js"></script></body></html>
