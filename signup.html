<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | DepoimentoPro</title><link rel="stylesheet" href="/styles.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2563eb"><link rel="icon" href="/icon-192.png"></head><body>
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="/">DepoimentoPro</a><div class="nav"><span class="small">Já tem conta?</span><a class="btn btn-light" href="/login">Entrar</a></div></div></header>
<section class="auth-shell"><div class="auth-card"><h1>Criar conta</h1><p>Comece no plano Free com até 5 depoimentos para validar o fluxo.</p><form id="signup-form"><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required minlength="2"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><div class="form-actions"><button class="btn btn-primary" type="submit">Criar minha conta</button></div><div id="msg" class="message"></div></form><p class="small">Ao criar a conta, você concorda com os <a href="/termos">Termos</a> e a <a href="/privacidade">Política de Privacidade</a>.</p></div></section><script src="/auth.js"></script><script src="/pwa.js"></script></body></html>
